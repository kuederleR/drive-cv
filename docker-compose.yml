version: '3.8'

services:
  drivecv-host:
    build:
      context: .
      dockerfile: Dockerfile.host
    container_name: drivecv-host-app
    restart: unless-stopped
    privileged: true
    network_mode: host
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      - PYTHONUNBUFFERED=1
      - CAMERA_DEVICE=/dev/video0
      - RECORDINGS_DIR=/recordings
    volumes:
      - .:/app
      - /home/ryan/beaterai/dashcam_app/recordings:/recordings:ro
    command: python3 main.py --host 0.0.0.0 --port 5000 --source camera --camera-device /dev/video0
