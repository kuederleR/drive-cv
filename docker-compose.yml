version: '3.8'

services:
  drivecv-host:
    build:
      context: .
      dockerfile: Dockerfile.host
    container_name: drivecv-host-app
    restart: unless-stopped
    privileged: true
    network_mode: host
    ports:
      - "5000:5000"
      - "5001:5001"
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      - PYTHONUNBUFFERED=1
      - CAMERA_DEVICE=/dev/video0
    volumes:
      - .:/app
    command: python3 main.py --host 0.0.0.0 --port 5000 --source camera --camera-device /dev/video0
