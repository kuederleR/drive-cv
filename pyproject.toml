[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drivecv"
version = "1.0.0"
description = "High-Performance Autonomous Driving Perception, Tracking & ADAS Suite"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.8.0",
    "onnxruntime>=1.15.0",
]

[project.scripts]
drivecv = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drivecv*"]
